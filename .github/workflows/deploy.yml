name: Check & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Check, build & deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    # Deploys are skipped until the repository variable DEPLOY_ENABLED is "true"
    env:
      CAN_DEPLOY: ${{ vars.DEPLOY_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Quality gate (pages, links, canonicals, sitemap, redirects)
        run: node scripts/check.mjs

      - name: Build
        run: node scripts/build.mjs

      # main → production (frontendhelpers.com)
      - name: Deploy to production
        id: deploy
        if: ${{ env.CAN_DEPLOY == 'true' && github.ref == 'refs/heads/main' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --message "${{ github.sha }}"

      # Pull requests → a preview URL; production is untouched
      - name: Upload preview version
        id: preview
        if: ${{ env.CAN_DEPLOY == 'true' && github.event_name == 'pull_request' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --preview-alias pr-${{ github.event.number }} --message "PR #${{ github.event.number }} ${{ github.sha }}"

      - name: Report URL
        if: ${{ steps.deploy.outcome == 'success' || steps.preview.outcome == 'success' }}
        run: echo "Deployed — ${{ steps.deploy.outputs.deployment-url || steps.preview.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
